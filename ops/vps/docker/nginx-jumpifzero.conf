# --- jumpifzero (managed by install-docker.sh) ---
server {
    listen 80;
    server_name jumpifzero.com www.jumpifzero.com;

    client_max_body_size 52m;
    add_header X-JumpIfZero "1" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jz_frontend http://jumpifzero-frontend:3010;
        proxy_pass $jz_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jumpifzero.com www.jumpifzero.com;

    ssl_certificate     /etc/letsencrypt/live/jumpifzero.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jumpifzero.com/privkey.pem;

    client_max_body_size 52m;
    add_header X-JumpIfZero "1" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jz_frontend http://jumpifzero-frontend:3010;
        proxy_pass $jz_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# --- end jumpifzero ---
