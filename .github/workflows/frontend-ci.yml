name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fail if apps declare zod directly
        run: |
          node -e "const fs=require('fs'); for (const p of ['frontend/package.json','backend/package.json']) { const pkg=JSON.parse(fs.readFileSync(p,'utf8')); const deps={...pkg.dependencies,...pkg.devDependencies}; if (deps.zod) { console.error(p+' declares zod directly'); process.exit(1);} }"
      - name: Fail if multiple zod versions
        run: |
          node -e "
          const {execSync}=require('child_process');
          const tree=JSON.parse(execSync('npm ls zod --all --json',{encoding:'utf8'}));
          const versions=new Set();
          (function walk(node){
            if (!node || typeof node !== 'object') return;
            if (node.dependencies) {
              for (const [name, child] of Object.entries(node.dependencies)) {
                if (name === 'zod' && child && child.version) versions.add(child.version);
                walk(child);
              }
            }
          })(tree);
          if (versions.size !== 1) {
            console.error('expected exactly one zod version, found', [...versions]);
            process.exit(1);
          }
          console.log('zod version', [...versions][0]);
          "
      - run: npm run typecheck -w frontend
      - run: npm run lint -w frontend -- --max-warnings 0
      - run: npm run test -w frontend
      - run: npm run build -w frontend
      - name: Bundle size budget
        run: npm run check:bundle -w frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright + axe smoke
        run: npm run test:e2e -w frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - run: npm audit --omit=dev --audit-level=high -w frontend
